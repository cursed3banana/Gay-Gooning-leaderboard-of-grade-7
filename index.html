
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOONING LEADERBOARD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    padding: 35px 15px;
}

header {
    text-align: center;
    margin-bottom: 40px;
}

header h1 {
    font-size: clamp(32px, 7vw, 55px);
    color: #ff2525;
    text-shadow: 0 0 20px #ff0000;
    letter-spacing: 3px;
}

header p {
    color: #888;
    margin-top: 12px;
    letter-spacing: 4px;
    font-size: 12px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.card {
    background: linear-gradient(135deg, #191919, #101010);
    border: 1px solid #333;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 22px;
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #ff2525;
    box-shadow: 0 0 18px #ff252533;
}

.rank {
    font-size: 32px;
    font-weight: 900;
    color: #ff3838;
    min-width: 55px;
}

.info h2 {
    font-size: 21px;
    margin-bottom: 8px;
}

.info p {
    color: #888;
    font-size: 12px;
    letter-spacing: 2px;
}

.champion {
    border: 2px solid gold;
    background: linear-gradient(135deg, #29200b, #151515);
    box-shadow: 0 0 22px #b58b1640;
}

.champion .rank {
    color: gold;
}

.champion .info h2 {
    color: gold;
}

.tier {
    margin-left: auto;
    padding: 8px 12px;
    background: #292020;
    color: #ff5555;
    border-radius: 7px;
    font-size: 12px;
    font-weight: bold;
}

.champion .tier {
    background: #4a390b;
    color: gold;
}

footer {
    text-align: center;
    margin-top: 45px;
    color: #555;
    font-size: 11px;
    letter-spacing: 2px;
}

@media (max-width: 450px) {
    .card {
        padding: 18px;
        gap: 12px;
    }

    .rank {
        font-size: 25px;
        min-width: 43px;
    }

    .info h2 {
        font-size: 16px;
    }

    .tier {
        padding: 6px;
    }
}
</style>
</head>

<body>

<header>
    <h1>GOONING LEADERBOARD</h1>
    <p>THE OFFICIAL GOONING RANKING OF GRADE SEVEN</p>
</header>

<main class="container">

    <div class="card champion">
        <div class="rank">#1</div>
        <div class="info">
            <h2>GOONING SENPAI</h2>
            <p>HIDAJIBA Cayenne</p>
        </div>
        <div class="tier">S-TIER</div>
    </div>

    <div class="card">
        <div class="rank">#2</div>
        <div class="info">
            <h2>GAY GOON COCK</h2>
            <p>MATSUNO Kojiba</p>
        </div>
        <div class="tier">A-TIER</div>
    </div>

    <div class="card">
        <div class="rank">#3</div>
        <div class="info">
            <h2>LICKY PUSSY DICK</h2>
            <p>NAKAJIBA Hitonari</p>
        </div>
        <div class="tier">B-TIER</div>
    </div>

    <div class="card">
        <div class="rank">#4</div>
        <div class="info">
            <h2>RANDOM MOTHERFUCKER ASS</h2>
            <p>ISHIWATA Kamihiro</p>
        </div>
        <div class="tier">C-TIER</div>
    </div>

</main>

<footer>
   GOONING RANKINGS · OFFICIAL WEBSITE
</footer>

</body>
</html>
